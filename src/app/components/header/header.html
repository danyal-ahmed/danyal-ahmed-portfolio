<header class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur-md">
  <div class="mx-auto flex w-full items-center justify-between px-3 py-4 sm:px-4">
    <!-- Logo -->
    <div class="font-mono text-lg font-bold tracking-tight text-indigo-400">
      DanBot<span class="text-slate-100">.io</span>
    </div>

    <!-- Right Side Container (Nav + Conditional Dropdown) -->
    <div class="flex items-center gap-6">
      <nav class="flex items-center gap-6 text-sm font-medium text-slate-400">
        <a routerLink="/" routerLinkActive="text-white" class="transition hover:text-white">
          &gt; Home
        </a>
        <a routerLink="/projects" routerLinkActive="text-white" class="transition hover:text-white">
          &gt; Projects
        </a>
        <a routerLink="/contact" routerLinkActive="text-white" class="transition hover:text-white">
          &gt; Contact
        </a>
        <a routerLink="/about" routerLinkActive="text-white" class="transition hover:text-white">
          &gt; About
        </a>
      </nav>

      <!-- Dropdown: Only visible if logged in -->
      @if (authService.isAuthenticated()) {
        <div class="relative ml-2">
          <button
            (click)="toggleDropdown()"
            class="flex items-center justify-center w-8 h-8 rounded bg-slate-900 border border-slate-700 hover:border-green-500/50 hover:bg-slate-800 transition-colors focus:outline-none"
            title="Admin Menu"
          >
            <!-- Retro Terminal/System Icon -->
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="text-slate-300"
            >
              <polyline points="4 17 10 11 4 5"></polyline>
              <line x1="12" y1="19" x2="20" y2="19"></line>
            </svg>
          </button>

          <!-- Dropdown Menu -->
          @if (isDropdownOpen()) {
            <!-- Invisible backdrop to close dropdown when clicking outside -->
            <div class="fixed inset-0 z-40" (click)="isDropdownOpen.set(false)"></div>

            <div
              class="absolute right-0 mt-2 w-48 bg-slate-900 border border-slate-800 rounded-lg shadow-xl py-1 z-50 font-mono text-sm overflow-hidden"
            >
              <a
                routerLink="/admin/dashboard"
                (click)="isDropdownOpen.set(false)"
                class="block px-4 py-2.5 text-slate-300 hover:bg-slate-800 hover:text-green-400 transition-colors"
              >
                ❯ Dashboard
              </a>
              <div class="border-t border-slate-800"></div>
              <button
                (click)="logout()"
                class="w-full text-left px-4 py-2.5 text-slate-400 hover:bg-red-900/20 hover:text-red-400 transition-colors flex items-center gap-2"
              >
                ❯ Logout
              </button>
            </div>
          }
        </div>
      }
    </div>
  </div>
</header>
